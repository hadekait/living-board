<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3e6d3">
<meta name="mobile-web-app-capable" content="yes">
<title>Living Board</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#4a3b2c; --dim:#8a7660; --leaf:#7d9a5a; --leaf-soft:#e7eedb; --cream:#fffaf1;
    --card:rgba(255,250,241,.88); --line:rgba(140,110,80,.18); --accent:#d9805f;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#f3e6d3; color:var(--ink); overflow:hidden;
    font-family:"M PLUS Rounded 1c", "Noto Sans JP", sans-serif; -webkit-user-select:none; user-select:none; }
  
  #stage { position:absolute; left:50%; top:50%; width:min(100vw, 160vh); height:min(62.5vw, 100vh);
    transform:translate(-50%,-50%); background:url(room.webp) center/100% 100% no-repeat; font-size:min(1vw, 1.6vh); }

  #face { position:absolute; left:13.6%; top:46.8%; width:7.3%; height:9.8%; }
  #face svg { width:100%; height:100%; display:block; }
  .lid { transition:transform .12s; transform-origin:50% 60px; transform-box:view-box; }
  .blink .lid { transform:scaleY(.25); }

  #bubble { position:absolute; left:25%; top:7%; width:43%; min-height:34%; padding:2.2em 2.6em 2em;
    background:var(--cream); border-radius:2.4em; box-shadow:0 .6em 1.8em rgba(120,80,40,.18); }
  #bubble::after { content:""; position:absolute; left:3.5em; bottom:-3.2em; border:1.8em solid transparent;
    border-top:3.4em solid var(--cream); border-left:1em solid transparent; transform:skewX(28deg); }
  #ask { font-size:4.6em; font-weight:800; letter-spacing:.04em; line-height:1.15; }
  #ask small { display:block; font-size:.36em; font-weight:700; color:var(--dim); letter-spacing:.08em; margin-bottom:.3em; }
  #plans { list-style:none; margin:1.1em 0 0; padding:0; font-size:2.2em; font-weight:700; }
  #plans li { display:flex; gap:.7em; align-items:baseline; padding:.32em 0; border-top:1px dashed var(--line); }
  #plans li:first-child { border-top:0; }
  #plans .t { flex:0 0 4.2em; color:var(--leaf); font-variant-numeric:tabular-nums; }
  #plans .n { flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #plans .more { color:var(--dim); font-size:.8em; }
  #hint { position:absolute; right:2.2em; top:1.6em; font-size:1.4em; color:var(--dim); font-weight:700;
    padding:.2em .8em; border-radius:1em; background:var(--leaf-soft); }
  #hint[hidden] { display:none; }

  #full { position:fixed; inset:0; background:rgba(255,250,241,.97); z-index:10; overflow:auto;
    padding:4vh 6vw; font-size:min(1vw, 1.6vh); }
  #full[hidden] { display:none; }
  #full h2 { margin:0 0 .6em; font-size:4em; font-weight:800; }
  #full ul { list-style:none; margin:0; padding:0; }
  #full li { display:flex; gap:1em; align-items:baseline; padding:.6em 0; border-top:1px dashed var(--line); font-size:2.8em; font-weight:700; }
  #full li:first-child { border-top:0; }
  #full .t { flex:0 0 4.4em; color:var(--leaf); font-variant-numeric:tabular-nums; }
  #full .n { flex:1 1 auto; overflow-wrap:anywhere; }
  #full .s { font-size:.6em; padding:.15em .7em; border-radius:1em; background:var(--leaf-soft); color:#5a7340; white-space:nowrap; }
  #full .foot { margin-top:1.2em; font-size:2.2em; color:var(--accent); font-weight:700; }
  #full .close { margin-top:1.6em; font-size:1.8em; color:var(--dim); }

  #trashFull { position:fixed; inset:0; background:rgba(255,250,241,.98); z-index:10; padding:3vh 3vw;
    font-size:min(1vw, 1.6vh); display:flex; flex-direction:column; }
  #trashFull[hidden] { display:none; }
  #trashFull h2 { margin:0 0 .4em; font-size:3.6em; font-weight:800; }
  #months { display:flex; gap:3em; flex:1 1 auto; min-height:0; }
  .month { flex:1 1 0; display:flex; flex-direction:column; min-height:0; }
  .month h3 { margin:0 0 .3em; font-size:2.8em; font-weight:800; }
  .grid { display:grid; grid-template-columns:repeat(7, 1fr); grid-template-rows:auto; grid-auto-rows:minmax(0, 1fr); gap:.4em; flex:1 1 auto; min-height:0; }
  .grid .wd { font-size:1.6em; font-weight:800; text-align:center; color:var(--dim); align-self:end; }
  .grid .wd.sun, .grid .day.sun .dn { color:#d0605a; } .grid .wd.sat, .grid .day.sat .dn { color:#5a7bc0; }
  .grid .day { border-radius:.8em; background:#fff; padding:.3em .4em; display:flex; flex-direction:column; overflow:hidden; }
  .grid .day .dn { font-size:2em; font-weight:800; line-height:1; }
  .grid .day .ty { font-size:1.35em; font-weight:800; line-height:1.15; margin-top:.2em; }
  .grid .day.today { outline:.35em solid var(--accent); }
  .grid .day.past { opacity:.45; }
  #trashFull .legend { margin-top:.8em; font-size:1.7em; color:var(--dim); }

  .pop { animation:poof-in .42s cubic-bezier(.22,1.45,.42,1) both; }
  .pop.closing { animation:poof-out .22s ease-in both; }
  @keyframes poof-in {
    0%   { opacity:0; transform:scale(.6); filter:blur(6px); }
    60%  { opacity:1; filter:blur(0); }
    100% { opacity:1; transform:scale(1); }
  }
  @keyframes poof-out {
    0%   { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(.85); filter:blur(4px); }
  }

  #wx .ico { width:4.6em; height:4.6em; flex:0 0 auto; align-self:center; }
  #plans .s { font-size:.62em; padding:.15em .7em; border-radius:1em; background:var(--leaf-soft); color:#5a7340; white-space:nowrap; }
  #plans .none { color:var(--dim); font-weight:500; }
  #home { margin-top:.8em; font-size:1.9em; font-weight:700; color:var(--accent); }
  #home span { display:inline-block; margin-right:1.2em; }
  #outfit { margin-top:.7em; padding:.5em .9em; border-radius:1em; background:var(--leaf-soft); font-size:1.9em; font-weight:700; color:#55703a; }
  #outfit:empty { display:none; }
  #outfit.evening { background:#d7ecf7; color:#3c6f8c; }  

  #cards { position:absolute; right:3.5%; top:8%; width:24%; display:flex; flex-direction:column; gap:1.4em; }
  .card { background:var(--card); border-radius:1.8em; padding:1.3em 1.6em; box-shadow:0 .4em 1.2em rgba(120,80,40,.12); }
  #clock { font-size:6.4em; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  #date { font-size:2em; color:var(--dim); font-weight:700; margin-top:.25em; }
  .label { font-size:1.5em; color:var(--dim); font-weight:700; letter-spacing:.06em; }
  #wx { display:flex; align-items:baseline; gap:.6em; margin-top:.2em; }
  #wx .now { font-size:4.4em; font-weight:800; }
  #wx .desc { font-size:2.2em; font-weight:700; }
  #wxsub { font-size:1.7em; color:var(--dim); margin-top:.2em; }
  #trash { font-size:2.3em; font-weight:800; margin-top:.15em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #trash2 { font-size:1.6em; color:var(--dim); margin-top:.2em; line-height:1.4; }

  #corner { position:absolute; left:0; top:0; width:12vmin; height:12vmin; }
  #status { position:absolute; left:1.2%; bottom:1.2%; font-size:1.3em; color:rgba(74,59,44,.55); }
  dialog { border:0; border-radius:16px; background:var(--cream); color:var(--ink); font:inherit; font-size:18px;
    width:min(760px, 92vw); max-height:88vh; overflow:auto; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  dialog h3 { margin:.2em 0 .6em; } dialog h4 { margin:1.2em 0 .4em; color:var(--dim); }
  dialog input { font:inherit; font-size:17px; padding:6px 10px; border:1px solid #d8c8b0; border-radius:8px; width:100%; background:#fff; }
  dialog .row { display:grid; grid-template-columns:3em 1fr; gap:8px; align-items:center; margin:4px 0; }
  dialog button { font:inherit; font-size:17px; padding:8px 18px; border-radius:10px; border:1px solid #d8c8b0; background:#fff; color:var(--ink); }
  dialog ul { list-style:none; padding:0; margin:.4em 0; } dialog li { padding:8px 4px; border-bottom:1px solid #eadfcd; }
  #diag { font-size:14px; color:var(--dim); line-height:1.6; }
</style>
</head>
<body>
<div id="stage">
  <div id="face">
    <svg viewBox="0 0 160 140" aria-hidden="true">
      <g stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none">
        
        <path d="M30 30 Q44 22 58 30" /><path d="M102 30 Q116 22 130 30" />
      </g>
      
      <g id="eyes" class="lid" fill="#fff">
        <circle cx="44" cy="58" r="10" /><circle cx="116" cy="58" r="10" />
      </g>
      
      <path id="mouthRest" d="M68 96 Q80 112 92 96" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" />
      <circle id="mouthTalk" cx="80" cy="101" r="7" fill="#fff" style="display:none" />
      
      <g stroke="#f29bb0" stroke-width="4" stroke-linecap="round" opacity=".85">
        <path d="M24 82 L32 74" /><path d="M32 84 L40 76" /><path d="M120 84 L128 76" /><path d="M128 82 L136 74" />
      </g>
    </svg>
  </div>

  <div id="bubble">
    <div id="hint" hidden>タップで ぜんぶ見る</div>
    <div id="ask"><small id="askSub">きょう</small>今日の予定は？</div>
    <ul id="plans"><li><span class="none">予定を読み込んでいます…</span></li></ul>
    <div id="home"></div>
    <div id="outfit"></div>
  </div>

  <div id="cards">
    <div class="card"><div id="clock">--:--</div><div id="date"></div></div>
    <div class="card"><div class="label">てんき</div><div id="wx"><span class="desc">地点が未設定</span></div><div id="wxsub"></div></div>
    <div class="card"><div class="label" style="white-space:nowrap">ゴミ出し <span style="font-size:.75em;opacity:.8">タップでカレンダー</span></div><div id="trash">—</div><div id="trash2"></div></div>
  </div>

  <div id="status"></div>
  <div id="corner"></div>
</div>

<div id="full" hidden>
  <h2>今日の予定 ぜんぶ</h2>
  <ul id="fullList"></ul>
  <div class="foot" id="fullFoot"></div>
  <div class="close">どこかをタップすると もどります</div>
</div>

<div id="trashFull" hidden>
  <h2>ゴミ出しカレンダー</h2>
  <div id="months"></div>
  <div class="legend">朝8時までに出してね ／ どこかをタップすると もどります</div>
</div>

<dialog id="dlg">
  <h3>設定(この端末の中だけに保存します)</h3>
  <h4>天気の地点</h4>
  <div style="display:flex;gap:8px"><input id="placeQ" placeholder="例: 横浜市 / Yokohama"><button id="placeGo">検索</button></div>
  <ul id="placeList"></ul>
  <h4>予定の受け取り口</h4>
  <input id="feedUrl" placeholder="https://script.google.com/macros/s/…/exec">
  <input id="feedTok" placeholder="合言葉" style="margin-top:6px">
  <h4>ゴミ出し(曜日ごと。空欄=なし)</h4>
  <div id="trashRows"></div>
  <h4>状態</h4>
  <div id="diag"></div>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
    <button id="dlgCancel">閉じる</button><button id="dlgSave">保存</button>
  </div>
</dialog>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const WD = ['日','月','火','水','木','金','土'];
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem('lb.' + k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { localStorage.setItem('lb.' + k, JSON.stringify(v)); },
};

(function takeSetup() {
  const m = location.hash.match(/^#setup=(.+)$/);
  if (!m) return;
  try {
    const cfg = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));
    if (cfg.feedUrl) store.set('feedUrl', cfg.feedUrl);
    if (cfg.feedTok) store.set('feedTok', cfg.feedTok);
  } catch (e) {  }
  history.replaceState(null, '', location.pathname);
})();

function tick() {
  const d = new Date();
  $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
  $('date').textContent = `${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]})`;
  renderTrash(d);
  renderOutfit(d);
}
tick(); setInterval(tick, 1000 * 20);

function blink() { $('face').classList.add('blink'); setTimeout(() => $('face').classList.remove('blink'), 140); }
setInterval(() => { if (Math.random() < .5) blink(); }, 3500);
function talk(ms) {
  const rest = $('mouthRest'), dot = $('mouthTalk'); let on = false;
  const iv = setInterval(() => { on = !on; dot.style.display = on ? '' : 'none'; rest.style.display = on ? 'none' : ''; }, 180);
  setTimeout(() => { clearInterval(iv); dot.style.display = 'none'; rest.style.display = ''; }, ms);
}

function renderPlans(data, stale) {
  const ul = $('plans'); ul.innerHTML = '';
  const now = new Date();
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()), t1 = new Date(t0.getTime() + 86400000);
  const todayYmd = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

  const dayOf = (iso) => new Date(new Date(iso).getTime() + 12 * 3600000).toISOString().slice(0, 10);
  const items = (data.events || []).filter((e) => e.allDay
    ? dayOf(e.start) <= todayYmd && todayYmd < dayOf(e.end)
    : new Date(e.start) < t1 && new Date(e.end) > t0);
  if (!items.length) ul.innerHTML = '<li><span class="none">きょうは予定なし。のんびりいこう</span></li>';
  items.slice(0, 4).forEach((e) => ul.appendChild(itemRow(e)));
  if (items.length > 4) { const li = document.createElement('li'); li.innerHTML = `<span class="more">ほか ${items.length - 4} 件</span>`; ul.appendChild(li); }
  todayItems = items; todayDismissal = data.dismissal || [];
  
  requestAnimationFrame(() => {
    const cut = items.length > 4 || [...ul.querySelectorAll('.n')].some((n) => n.scrollWidth > n.clientWidth + 1);
    $('hint').hidden = !cut;
  });
  $('home').innerHTML = '';
  (data.dismissal || []).forEach((d) => {
    const s = document.createElement('span');
    s.textContent = `${d.grade} ${d.text === 'お休み' ? 'お休み' : d.text + ' 下校'}`;
    $('home').appendChild(s);
  });
  $('status').textContent = stale ? '予定は前回の読み込み分です' : '';
}
let todayItems = [], todayDismissal = [];
function itemRow(e) {
  const li = document.createElement('li');
  const t = document.createElement('span'); t.className = 't'; t.textContent = e.time || 'いちにち';
  const n = document.createElement('span'); n.className = 'n'; n.textContent = e.title;
  li.append(t, n);
  if (e.cal === 'school') { const s = document.createElement('span'); s.className = 's'; s.textContent = '学校'; li.append(s); }
  return li;
}

function openPop(el, ev) {
  el.style.transformOrigin = ev ? `${ev.clientX}px ${ev.clientY}px` : 'center';
  el.classList.remove('closing'); el.hidden = false;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}
function closePop(el) {
  if (el.classList.contains('closing')) return;
  el.classList.add('closing');
  
  const done = () => { if (!el.classList.contains('closing')) return; el.hidden = true; el.classList.remove('pop', 'closing'); };
  el.addEventListener('animationend', done, { once: true });
  setTimeout(done, 320);
}

$('bubble').addEventListener('click', (ev) => {
  if (!todayItems.length) return;
  const ul = $('fullList'); ul.innerHTML = '';
  todayItems.forEach((e) => ul.appendChild(itemRow(e)));
  $('fullFoot').textContent = todayDismissal.map((d) => `${d.grade} ${d.text === 'お休み' ? 'お休み' : d.text + ' 下校'}`).join('　');
  openPop($('full'), ev);
});
$('full').addEventListener('click', () => closePop($('full')));

let lastSig = '';
async function loadPlans() {
  const url = store.get('feedUrl', ''), tok = store.get('feedTok', '');
  if (!url || !tok) { $('plans').innerHTML = '<li><span class="none">予定の受け取り口が未設定です</span></li>'; return; }
  try {
    const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(tok) + '&days=2');
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'ng');
    store.set('lastFeed', j);
    renderPlans(j, false); renderTrash(new Date());
    const sig = JSON.stringify(j.events) + JSON.stringify(j.dismissal);
    if (sig !== lastSig) { lastSig = sig; talk(2200); }
  } catch (e) {
    const last = store.get('lastFeed', null);
    if (last) renderPlans(last, true); else $('plans').innerHTML = '<li><span class="none">予定を読み込めませんでした</span></li>';
  }
}
loadPlans(); setInterval(loadPlans, 10 * 60 * 1000);

const WCODE = {0:'快晴',1:'晴れ',2:'晴れ時々くもり',3:'くもり',45:'きり',48:'きり',51:'きりさめ',53:'きりさめ',55:'きりさめ',
  61:'小雨',63:'雨',65:'大雨',71:'小雪',73:'雪',75:'大雪',80:'にわか雨',81:'にわか雨',82:'つよいにわか雨',95:'かみなり',96:'かみなり',99:'かみなり'};
async function loadWeather() {
  const p = store.get('place', null); if (!p) return;
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}` +
      '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=1';
    const j = await (await fetch(u)).json();
    $('wx').innerHTML = wxIcon(j.current.weather_code) +
      `<span class="now">${Math.round(j.current.temperature_2m)}°</span><span class="desc">${WCODE[j.current.weather_code] ?? ''}</span>`;
    const hi = j.daily.temperature_2m_max[0], lo = j.daily.temperature_2m_min[0], rain = j.daily.precipitation_probability_max[0];
    $('wxsub').textContent = `最高 ${Math.round(hi)}° / 最低 ${Math.round(lo)}° / 雨 ${rain ?? '—'}%`;
    outfitText = outfit(hi, lo, rain); renderOutfit(new Date());
  } catch (e) { $('wxsub').textContent = '天気を読み込めませんでした'; }
}

function wxIcon(code) {
  const sun = '<circle cx="32" cy="32" r="11" fill="#f6b73c"/><g stroke="#f6b73c" stroke-width="4" stroke-linecap="round">' +
    [0,45,90,135,180,225,270,315].map((a) => { const r = a * Math.PI / 180;
      return `<line x1="${32+Math.cos(r)*17}" y1="${32+Math.sin(r)*17}" x2="${32+Math.cos(r)*23}" y2="${32+Math.sin(r)*23}"/>`; }).join('') + '</g>';
  const cloud = (x, y, c) => `<g transform="translate(${x} ${y})" fill="${c}"><circle cx="18" cy="22" r="10"/><circle cx="30" cy="16" r="13"/><circle cx="42" cy="23" r="9"/><rect x="8" y="22" width="44" height="11" rx="5.5"/></g>`;
  const drops = '<g stroke="#5f9bd1" stroke-width="3.5" stroke-linecap="round"><line x1="22" y1="50" x2="19" y2="58"/><line x1="33" y1="50" x2="30" y2="58"/><line x1="44" y1="50" x2="41" y2="58"/></g>';
  const snow = '<g fill="#9cc3e6"><circle cx="21" cy="54" r="3"/><circle cx="32" cy="57" r="3"/><circle cx="43" cy="54" r="3"/></g>';
  const bolt = '<path d="M34 44 L26 56 L33 56 L28 64 L41 50 L34 50 L38 44 Z" fill="#f6b73c"/>';
  const fog = '<g stroke="#b9ad9c" stroke-width="3.5" stroke-linecap="round"><line x1="12" y1="50" x2="52" y2="50"/><line x1="18" y1="57" x2="46" y2="57"/></g>';
  let body;
  if (code <= 1) body = sun;
  else if (code === 2) body = `<g transform="translate(-8 -8) scale(.8)">${sun}</g>` + cloud(6, 14, '#e9e2d6');
  else if (code === 3) body = cloud(2, 8, '#d9d0c2');
  else if (code === 45 || code === 48) body = cloud(2, 2, '#e3dccf') + fog;
  else if (code >= 71 && code <= 77) body = cloud(2, 6, '#d9d0c2') + snow;
  else if (code >= 95) body = cloud(2, 4, '#c9c0b2') + bolt;
  else body = cloud(2, 6, '#d2cabc') + drops;  
  return `<svg class="ico" viewBox="0 0 64 64" aria-hidden="true">${body}</svg>`;
}

var outfitText = '';
function renderOutfit(d) {
  const h = d.getHours(), evening = h >= 16 || h < 5;
  $('outfit').textContent = evening ? '宿題してから あそぼう！' : outfitText;
  $('outfit').classList.toggle('evening', evening);
}

function outfit(hi, lo, rain) {
  let day;
  if (hi >= 28) day = '半そでで すずしく';
  else if (hi >= 25) day = '半そでが ちょうどいい';
  else if (hi >= 21) day = '長そでシャツ1まいで OK';
  else if (hi >= 17) day = '長そで＋カーディガン';
  else if (hi >= 13) day = 'セーターや トレーナー＋うわぎ';
  else if (hi >= 9) day = 'コートを きていこう';
  else day = 'あつてのコート・マフラー・てぶくろ';
  const add = [];
  if (/うわぎ|コート/.test(day)) {  }
  else if (lo < 10 && hi >= 13) add.push('朝はさむいから うわぎを');
  else if (hi - lo >= 8 && hi >= 17) add.push('朝晩は はおりものを');
  if (rain != null && rain >= 50) add.push('かさを もっていこう');
  return 'きょうの服: ' + day + (add.length ? '。' + add.join('、') : '');
}
loadWeather(); setInterval(loadWeather, 30 * 60 * 1000);

function renderTrash(d) {
  
  const feed = store.get('lastFeed', null);
  const ymd = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  if (feed && feed.trash && feed.date === ymd) {
    $('trash').textContent = feed.trash.today ? `きょうは ${feed.trash.today}` : 'きょうはなし';
    $('trash2').textContent = (feed.trash.tomorrow ? `あしたは ${feed.trash.tomorrow}` : 'あしたはなし') + (feed.trash.today && feed.trash.note ? ` ／ ${feed.trash.note}` : '');
    return;
  }
  const t = store.get('trash', {});
  const today = t[d.getDay()] || '', tomorrow = t[(d.getDay() + 1) % 7] || '';
  $('trash').textContent = today ? `きょうは ${today}` : 'きょうはなし';
  $('trash2').textContent = tomorrow ? `あしたは ${tomorrow}` : '';
}

const TRASH_COLOR = [[/可燃/, '#f6b3aa'], [/缶/, '#d8bb93'], [/ガラス/, '#8fd3ef'], [/紙/, '#f7e07f'], [/金属|陶器/, '#b8da82'], [/ペット/, '#d3c0e6']];
function trashColor(t) { const hit = TRASH_COLOR.find(([re]) => re.test(t)); return hit ? hit[1] : '#eee'; }
function shortTrash(t) { return t.replace('飲料缶・スプレー缶', '缶・スプレー').replace('金属・陶器・リチウムイオン電池等', '金属・電池').replace('ペットボトル', 'ペット'); }
function monthGrid(y, m, cal, todayKey) {
  const box = document.createElement('div'); box.className = 'month';
  box.innerHTML = `<h3>${m + 1}月</h3>`;
  const g = document.createElement('div'); g.className = 'grid';
  WD.forEach((w, i) => { const c = document.createElement('div'); c.className = 'wd' + (i === 0 ? ' sun' : i === 6 ? ' sat' : ''); c.textContent = w; g.appendChild(c); });
  const first = new Date(y, m, 1).getDay(), last = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < first; i++) g.appendChild(document.createElement('div'));
  for (let d = 1; d <= last; d++) {
    const key = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`, wd = new Date(y, m, d).getDay();
    const c = document.createElement('div');
    c.className = 'day' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '') + (key === todayKey ? ' today' : '') + (key < todayKey ? ' past' : '');
    const t = cal[key] || '';
    if (t) c.style.background = trashColor(t);
    const dn = document.createElement('div'); dn.className = 'dn'; dn.textContent = d;
    const ty = document.createElement('div'); ty.className = 'ty'; ty.textContent = shortTrash(t);
    c.append(dn, ty); g.appendChild(c);
  }
  box.appendChild(g); return box;
}
document.querySelectorAll('.card')[2].addEventListener('click', (ev) => {
  const feed = store.get('lastFeed', null);
  if (!feed || !feed.trashCal) return;
  const now = new Date(), todayKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const ms = $('months'); ms.innerHTML = '';
  ms.appendChild(monthGrid(now.getFullYear(), now.getMonth(), feed.trashCal, todayKey));
  const nx = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  ms.appendChild(monthGrid(nx.getFullYear(), nx.getMonth(), feed.trashCal, todayKey));
  openPop($('trashFull'), ev);
});
$('trashFull').addEventListener('click', () => closePop($('trashFull')));

let pressT = null;
$('corner').addEventListener('pointerdown', () => { pressT = setTimeout(openDlg, 1500); });
['pointerup','pointerleave','pointercancel'].forEach((ev) => $('corner').addEventListener(ev, () => clearTimeout(pressT)));
function openDlg() {
  $('feedUrl').value = store.get('feedUrl', ''); $('feedTok').value = store.get('feedTok', '');
  const t = store.get('trash', {}); const rows = $('trashRows'); rows.innerHTML = '';
  [1,2,3,4,5,6,0].forEach((i) => {
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = `<span>${WD[i]}</span><input data-wd="${i}" placeholder="例: 燃えるゴミ">`;
    r.querySelector('input').value = t[i] || ''; rows.appendChild(r);
  });
  renderDiag(); $('dlg').showModal();
}
$('dlgCancel').onclick = () => $('dlg').close();
$('dlgSave').onclick = () => {
  store.set('feedUrl', $('feedUrl').value.trim()); store.set('feedTok', $('feedTok').value.trim());
  const t = {}; document.querySelectorAll('#trashRows input').forEach((el) => { if (el.value.trim()) t[el.dataset.wd] = el.value.trim(); });
  store.set('trash', t); $('dlg').close(); tick(); loadPlans();
};
$('placeGo').onclick = async () => {
  const q = $('placeQ').value.trim(); if (!q) return;
  const ul = $('placeList'); ul.innerHTML = '<li>検索中…</li>';
  const find = (n) => fetch('https://geocoding-api.open-meteo.com/v1/search?count=8&language=ja&name=' + encodeURIComponent(n)).then((r) => r.json());
  try {
    let j = await find(q);
    
    if (!(j.results || []).length && !/[市区町村]$/.test(q)) j = await find(q + '市');
    ul.innerHTML = '';
    (j.results || []).forEach((it) => {
      const li = document.createElement('li');
      li.textContent = [it.name, it.admin1, it.country].filter(Boolean).join(' / ');
      li.onclick = () => { store.set('place', { name: it.name, lat: it.latitude, lon: it.longitude }); ul.innerHTML = '<li>設定しました</li>'; loadWeather(); };
      ul.appendChild(li);
    });
    if (!ul.children.length) ul.innerHTML = '<li>見つかりませんでした</li>';
  } catch (e) { ul.innerHTML = '<li>検索できませんでした</li>'; }
};

let lock = null, lockState = '未取得';
async function keepAwake() {
  if (!('wakeLock' in navigator)) { lockState = '未対応'; return; }
  try { lock = await navigator.wakeLock.request('screen'); lockState = '有効';
    lock.addEventListener('release', () => { lockState = '解除'; }); } catch (e) { lockState = '失敗: ' + e.name; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
document.addEventListener('pointerdown', (ev) => {
  if (ev.target.closest('dialog')) return;
  if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  if (lockState !== '有効') keepAwake();
});
keepAwake();

setInterval(() => {
  const x = Math.round(Math.random()*10-5), y = Math.round(Math.random()*10-5);
  $('stage').style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
}, 600000);

let swState = '未対応';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(() => { swState = '登録済み'; }).catch((e) => { swState = '失敗: ' + e.name; });

function renderDiag() {
  const chrome = (navigator.userAgent.match(/Chrome\/([\d.]+)/) || [,'?'])[1];
  const last = store.get('lastFeed', null);
  $('diag').textContent = `全画面: ${document.fullscreenElement ? '全画面中' : '通常'} / 画面維持: ${lockState} / SW: ${swState} / Chrome ${chrome} / ` +
    `予定の最終取得: ${last ? last.date : 'なし'}`;
}
